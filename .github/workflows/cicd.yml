name: CI-CD FLASK Docker

on:
  push:
    branches: [main]

jobs:
  # -----------------------------
  # Job 1: Build & Push Docker
  # -----------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t soumiakh/flask_devops_demo:latest .

      - name: Push Docker image
        run: docker push soumiakh/flask_devops_demo:latest

  # -----------------------------
  # Job 2: Deploy via SSH
  # -----------------------------
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push   # Attend la fin du job 1

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem

            - name: Deploy Docker container
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "powershell -ExecutionPolicy Bypass -File 'D:\\TPCDSSH\\deploy.ps1' \
          -DockerUser ${{ secrets.DOCKERHUB_USERNAME }} \
          -DockerToken ${{ secrets.DOCKERHUB_TOKEN }}"